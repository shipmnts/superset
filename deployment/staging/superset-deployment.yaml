apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: superset
          image: shipmnts.azurecr.io/shipmnts/superset:__tag__
          ports:
            - containerPort: 8088
          envFrom:
            - secretRef:
                name: superset-secret
          env:
            # gunicorn kills any worker whose request exceeds --timeout, which
            # defaults to 60s in the base image's run-server.sh. That killed
            # chart queries at 60s regardless of SUPERSET_WEBSERVER_TIMEOUT
            # (300), because the web server gave up before the browser did.
            # Kept equal to SUPERSET_WEBSERVER_TIMEOUT so the two agree.
            - name: GUNICORN_TIMEOUT
              value: "300"
          imagePullPolicy: "Always"
---
apiVersion: v1
kind: Service
metadata:
  name: superset-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      nodePort: 30080
