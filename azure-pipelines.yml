# Superset — Build & Deploy pipeline
#
# Cluster: GKE (migrated off OVH). Deploys authenticate with gcloud Workload
# Identity Federation via pipeline-templates/gke-auth-steps.yml and then apply
# manifests with plain kubectl — there is no Kubernetes service connection and
# therefore no `<env>.default` resource, so the ADO environments are referenced
# by bare name (`staging`, not `staging.default`).
#
# The image tag is baked into the manifests by the replacetokens step (__tag__)
# instead of being patched by KubernetesManifest@0.
#
# Per-env superset_config.py / requirements-local.txt are baked into the image
# at build time from deployment/$(Build.SourceBranchName)/ via the BRANCH arg.
#
# AGENTS — the two stages deliberately run on different agents:
#   Build   -> vmImage: ubuntu-latest  (Microsoft-hosted)
#   Deploys -> pool: SelfHosted        (agent VMs inside the GCP network)
#
# Do not unify them.
#   * Deploys MUST stay SelfHosted: the clusters are private and reached via the
#     IAM-gated DNS endpoint, and gke-auth-steps.yml reads /opt/gcp/gcp-creds.json,
#     a file the VMSS provisioning script places only on those agent VMs. A hosted
#     agent has neither the creds file nor network authorisation.
#   * Build MUST stay hosted until the SelfHosted VMs get a bigger disk: they have
#     29GB with ~5GB free, and one build needs ~10-11GB (2.1GB node_modules +
#     1.6GB npm cache alone, measured). BuildKit's GC evicts the layer cache
#     mid-build, which produced build times of 13m / 1h59m / 3h9m at random.
#   The deploy stages only run kubectl, so the small disk does not affect them.

trigger:
  branches:
    include:
      - staging
      - master

pr: none

variables:
  imageRepository: "shipmnts/superset"
  containerRegistry: "shipmnts.azurecr.io"
  tag: "$(Build.BuildId)"
  dockerRegistryServiceConnection: "f4c49f70-1fb0-43e2-8754-5fd5f6235634"
  k8sNamespace: "default"
  k8sDeploymentName: "superset"
  dockerfilePath: "**/Dockerfile"
  # Build runs on a Microsoft-hosted agent; deploys run on SelfHosted. See the
  # header comment for why the two cannot be unified.
  vmImageName: "ubuntu-latest"
  poolName: "SelfHosted"
  DOCKER_BUILDKIT: 1

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: Build
        displayName: Build
        timeoutInMinutes: 300
        pool:
          # Microsoft-hosted, NOT SelfHosted. The SelfHosted agent VMs have a
          # 29GB disk with ~5GB free, while one build needs ~10-11GB (2.1GB
          # node_modules + 1.6GB npm cache alone). BuildKit's GC then evicts the
          # layer cache mid-build, which made builds take 13m/1h59m/3h9m at
          # random. Hosted agents have ~75GB free and build this in minutes.
          # Revert to $(poolName) only after those VMs get a >=100GB disk.
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Login to registry
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)
          - task: Docker@2
            displayName: Build image from dockerfile
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: "**/Dockerfile"
              tags: |
                latest
                $(tag)
                $(Build.SourceBranchName)
              arguments: "--cache-from $(containerRegistry)/$(imageRepository):$(Build.SourceBranchName) --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg BRANCH=$(Build.SourceBranchName)"

          - task: Docker@2
            displayName: push image to container registry
            inputs:
              command: push
              repository: $(imageRepository)
              tags: |
                latest
                $(tag)
                $(Build.SourceBranchName)
          - upload: deployment
            artifact: deployment

  # ─────────────────────────────────────────────────────────────
  # DEPLOY
  # GKE target + manifest-dir variables are selected at queue time from the
  # source branch. No development deploy — no hub-development cluster exists.
  # To add a new environment: add its branch to trigger, a matching
  # variables: block below, AND a matching environment: block on the job —
  # all three must stay in sync.
  # ─────────────────────────────────────────────────────────────
  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    condition: |
      and(
        succeeded('Build'),
        in(variables['Build.SourceBranchName'], 'staging', 'production')
      )
    variables:
      ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
        gkeCluster: hub-staging
        gkeProject: hubnonprod
        gkeLocation: asia-south1-a
        gcpCredsFile: /opt/gcp/gcp-creds.json
        manifestDir: staging
      ${{ if eq(variables['Build.SourceBranchName'], 'production') }}:
        gkeCluster: hub-prod
        gkeProject: hubprod-502013
        gkeLocation: asia-south1 # regional cluster
        gcpCredsFile: /opt/gcp/gcp-creds-prod.json
        manifestDir: production
    jobs:
      - deployment: Deploy
        displayName: Deploy
        pool:
          name: $(poolName)
        ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
          environment: staging
        ${{ if eq(variables['Build.SourceBranchName'], 'production') }}:
          environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /pipeline-templates/deploy-superset-steps.yml
                  parameters:
                    manifestDir: $(manifestDir)
                    cluster: $(gkeCluster)
                    project: $(gkeProject)
                    location: $(gkeLocation)
                    credsFile: $(gcpCredsFile)
