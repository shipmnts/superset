# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - development
  - staging
  - production

pr:
  branches:
    exclude:
      - '*'
    include: []

variables:
  imageRepository: 'shipmnts/superset'
  tag: '$(Build.BuildId)'
  dockerRegistryServiceConnection: 'dockerhub-service-connection'
  k8sNamespace: 'default'
  k8sDeploymentName: 'superset'
  dockerfilePath: '**/Dockerfile'
  vmImageName: 'ubuntu-latest'
  
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Login to registry
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)
    - task: Bash@3
      displayName: Ensure buildx builder
      inputs:
        targetType: inline
        script: |
          docker buildx inspect superset-builder >/dev/null 2>&1 || \
            docker buildx create --name superset-builder --driver docker-container --use
          docker buildx use superset-builder
          docker buildx inspect --bootstrap
    - task: Bash@3
      displayName: Build and push image
      inputs:
        targetType: inline
        script: |
          docker buildx build \
            --builder superset-builder \
            --file Dockerfile \
            --build-arg BRANCH=$(Build.SourceBranchName) \
            --cache-from type=registry,ref=$(imageRepository):buildcache-$(Build.SourceBranchName) \
            --cache-to type=registry,ref=$(imageRepository):buildcache-$(Build.SourceBranchName),mode=max \
            --tag $(imageRepository):latest \
            --tag $(imageRepository):$(tag) \
            --tag $(imageRepository):$(Build.SourceBranchName) \
            --push \
            .
    - upload: deployment
      artifact: deployment
- stage: Development
  condition: and(succeeded(), eq(variables['build.SourceBranchName'], 'development'))
  displayName: Development Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'development'
    variables:
      k8sCluster: hub-development
    strategy:
      runOnce:
        deploy:
          steps:
            - task: KubernetesManifest@1
              displayName: Deploy to Kubernetes cluster
              inputs:
                action: deploy
                connectionType: azureResourceManager
                azureSubscriptionConnection: azure-arm
                azureResourceGroup: HubNonProd
                kubernetesCluster: $(k8sCluster)
                namespace: default
                manifests: |
                  $(Pipeline.Workspace)/deployment/development/superset-deployment.yaml
                containers: |
                  $(imageRepository):$(tag)

- stage: Staging
  condition: and(succeeded(), eq(variables['build.SourceBranchName'], 'staging'))
  displayName: Staging Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'staging'
    variables:
      k8sCluster: hub-staging
    strategy:
      runOnce:
        deploy:
          steps:
            - task: KubernetesManifest@1
              displayName: Deploy to Kubernetes cluster
              inputs:
                action: deploy
                connectionType: azureResourceManager
                azureSubscriptionConnection: azure-arm
                azureResourceGroup: HubNonProd
                kubernetesCluster: $(k8sCluster)
                namespace: default
                manifests: |
                  $(Pipeline.Workspace)/deployment/staging/superset-deployment.yaml
                containers: |
                  $(imageRepository):$(tag)

- stage: Production
  condition: and(succeeded(), eq(variables['build.SourceBranchName'], 'production'))
  displayName: Production Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'production'
    variables:
      k8sCluster: hub-prod
    strategy:
      runOnce:
        deploy:
          steps:
            - task: KubernetesManifest@1
              displayName: Deploy to Kubernetes cluster
              inputs:
                action: deploy
                connectionType: azureResourceManager
                azureSubscriptionConnection: azure-arm
                azureResourceGroup: HubNonProd
                kubernetesCluster: $(k8sCluster)
                namespace: default
                manifests: |
                  $(Pipeline.Workspace)/deployment/production/superset-deployment.yaml
                containers: |
                  $(imageRepository):$(tag)